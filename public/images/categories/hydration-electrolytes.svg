<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0d13"/>
      <stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="jar" x1="140" y1="120" x2="260" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="200" cy="180" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#grid)"/>
  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- bottle cap -->
  <rect x="165" y="96" width="70" height="26" rx="8" fill="#60a5fa" fill-opacity="0.85"/>
  <!-- bottle body -->
  <rect x="150" y="122" width="100" height="182" rx="22" fill="url(#jar)"/>
  <rect x="150" y="122" width="100" height="182" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  <!-- label -->
  <rect x="162" y="176" width="76" height="86" rx="10" fill="#0a0d13" fill-opacity="0.72"/>
  <rect x="162" y="176" width="76" height="86" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <!-- emoji on label -->
  <text x="200" y="214" font-size="34" text-anchor="middle" dominant-baseline="central">💧</text>
  <!-- label lines -->
  <rect x="176" y="234" width="48" height="6" rx="3" fill="#60a5fa" fill-opacity="0.9"/>
  <rect x="182" y="246" width="36" height="4" rx="2" fill="#ffffff" fill-opacity="0.35"/>
  <!-- category label -->
  <text x="200" y="342" font-size="15" font-family="Arial, sans-serif" font-weight="600" fill="#ffffff" fill-opacity="0.55" text-anchor="middle">Hydration &amp; Electrolytes</text>
</svg>